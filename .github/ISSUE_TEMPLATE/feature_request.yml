name: Feature or experiment request
description: Suggest a new model, prompt, metric or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What question or problem would this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
